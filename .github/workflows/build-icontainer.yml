name: Build iContainer
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved private source commit (40 hex characters)
        required: false
      build_number:
        description: Increasing iPhone app build number
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: public-icontainer-build
  cancel-in-progress: false
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Validate build request
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
          if [[ -z "$BUILD_NUMBER" ]]; then BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)); fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: hongson117/iSideload
          ref: ${{ inputs.source_sha || 'feat/icontainer' }}
          ssh-key: ${{ secrets.ICONTAINER_SOURCE_READ_KEY }}
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /core/
            !**/target/
      - name: Record source identity
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Test private core without publishing source diagnostics
        run: |
          if cargo test --locked --manifest-path core/Cargo.toml >/tmp/core-tests.log 2>&1; then
            echo 'Core regression tests passed.'
          else
            echo 'Core regression tests failed; private diagnostics were not uploaded.'
            exit 1
          fi
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Validate build request
        run: |
          if [[ -n "$SOURCE_SHA" ]]; then [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
          if [[ -z "$BUILD_NUMBER" ]]; then BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)); fi
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: hongson117/iSideload
          ref: ${{ inputs.source_sha || 'feat/icontainer' }}
          ssh-key: ${{ secrets.ICONTAINER_SOURCE_READ_KEY }}
          persist-credentials: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /core/
            /ios/
            /scripts/
            /tests/
            /project.yml
            /project-icontainer.yml
            !**/target/
      - name: Record source identity
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build private signing core
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          export ISL_GIT_SHA=${SOURCE_SHA:0:7}
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${HOME}/.cargo=/deps/cargo"
          cargo build --locked --release --target aarch64-apple-ios --manifest-path core/Cargo.toml >/tmp/core-build.log 2>&1 || { echo 'Core build failed; private diagnostics were not uploaded.'; exit 1; }
      - name: Test app policies and generate project
        run: |
          (
            set -e
            swiftc -parse-as-library ios/iSideload/Core/SelfSigningIdentity.swift tests/SelfSigningIdentityTests.swift -o /tmp/identity-tests
            /tmp/identity-tests
            swiftc -parse-as-library ios/iSideload/Core/PeerSigningChoice.swift tests/PeerSigningChoiceTests.swift -o /tmp/choice-tests
            /tmp/choice-tests
            swiftc -parse-as-library ios/iSideload/Core/AppUpdate.swift tests/AppUpdateTests.swift -o /tmp/update-tests
            /tmp/update-tests
            swiftc -parse-as-library ios/iSideload/Core/CoreInteractionPolicy.swift tests/CoreInteractionPolicyTests.swift -o /tmp/interaction-tests
            /tmp/interaction-tests
            swiftc -parse-as-library ios/iSideload/Core/Models.swift ios/iSideload/Core/InstalledAppState.swift tests/InstalledAppStateTests.swift -o /tmp/lifecycle-tests
            /tmp/lifecycle-tests
            swiftc -parse-as-library ios/iSideload/Core/PairingRecord.swift tests/PairingRecordTests.swift -o /tmp/pair-tests
            /tmp/pair-tests
            swiftc -parse-as-library ios/iSideload/Core/Models.swift ios/iSideload/Core/LiveContainerSigning.swift tests/LiveContainerSigningTests.swift -o /tmp/lc-tests
            /tmp/lc-tests
            swiftc -parse-as-library ios/iContainer/ContainerGuest.swift tests/ContainerGuestTests.swift -o /tmp/guest-tests
            /tmp/guest-tests
            python3 -m venv /tmp/ic-python
            /tmp/ic-python/bin/python -m pip install --quiet pyyaml
            EXPECTED_VERSION=$(/tmp/ic-python/bin/python -c "import yaml; print(yaml.safe_load(open('project-icontainer.yml'))['targets']['iContainer']['settings']['base']['MARKETING_VERSION'])")
            echo "SOURCE_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
            /tmp/ic-python/bin/python scripts/configure_icontainer.py
            GENERATED_VERSION=$(/tmp/ic-python/bin/python -c "import yaml; print(yaml.safe_load(open('project-icontainer.yml'))['targets']['iContainer']['settings']['base']['MARKETING_VERSION'])")
            [[ "$EXPECTED_VERSION" == "$GENERATED_VERSION" ]]
            python3 scripts/generate_notices.py
            brew install xcodegen
            xcodegen generate --spec project-icontainer.yml
          ) >/tmp/app-tests.log 2>&1 || { echo 'App checks failed; private diagnostics were not uploaded.'; exit 1; }
          echo 'App policy tests passed.'
      - name: Verify real iOS Mach-O RPATH transformation
        run: |
          (
            set -e
            SDK=$(xcrun --sdk iphoneos --show-sdk-path)
            xcrun clang -target arm64-apple-ios17.0 -isysroot "$SDK" -fobjc-arc -framework UIKit -framework Foundation -framework CoreGraphics -Wl,-headerpad,4096 -Wl,-rpath,@executable_path/Frameworks -Wl,-rpath,@loader_path/Frameworks tests/ContainerDemo/main.m -o /tmp/ContainerDemo
            rustc --edition=2021 scripts/verify_container_demo.rs -o /tmp/verify-demo
            /tmp/verify-demo /tmp/ContainerDemo /tmp/ContainerDemo.dylib
            xcrun otool -hv /tmp/ContainerDemo.dylib
          ) >/tmp/macho-smoke.log 2>&1 || { echo 'Native Mach-O preparation check failed; private diagnostics were not uploaded.'; exit 1; }
      - name: Build unsigned app
        run: |
          xcodebuild -project iContainer.xcodeproj -scheme iContainer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build >/tmp/app-build.log 2>&1 || { echo 'App build failed; private diagnostics were not uploaded.'; exit 1; }
      - name: Package audited binary only
        run: |
          APP=build/Build/Products/Release-iphoneos/iContainer.app
          /usr/libexec/PlistBuddy -c "Set :ISLGitSHA ${SOURCE_SHA:0:7}" "$APP/Info.plist"
          mkdir -p out/Payload publish
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../publish/iContainer.ipa Payload)
          python3 scripts/audit_release.py --self-test >/tmp/audit-test.log 2>&1
          python3 scripts/audit_release.py publish/iContainer.ipa --expected-sha "${SOURCE_SHA:0:7}" --output publish/recipient-audit.json >/tmp/audit.log 2>&1
          (cd publish && shasum -a 256 iContainer.ipa > SHA256SUMS.txt)
          python3 - <<'PY'
          import os,json,pathlib,plistlib
          info=plistlib.loads(pathlib.Path('out/Payload/iContainer.app/Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']==os.environ['SOURCE_VERSION'], 'Packaged version differs from committed target'
          pathlib.Path('publish/BUILD-SOURCE.json').write_text(json.dumps({'source_commit':os.environ['SOURCE_SHA'],'build':str(info['CFBundleVersion']),'product':'iContainer','version':info['CFBundleShortVersionString'],'unsigned':True}))
          pathlib.Path('publish/ThirdPartyNotices.txt').write_bytes(pathlib.Path('out/Payload/iContainer.app/ThirdPartyNotices.txt').read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iContainer-public-${{ env.BUILD_NUMBER }}
          retention-days: 3
          if-no-files-found: error
          path: |
            publish/iContainer.ipa
            publish/SHA256SUMS.txt
            publish/recipient-audit.json
            publish/BUILD-SOURCE.json
            publish/ThirdPartyNotices.txt

  publish:
    needs: [core-tests, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: iContainer-public-*
          path: release-files
          merge-multiple: true
      - name: Publish IPA and advance update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_icontainer.py release-files
