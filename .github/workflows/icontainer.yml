name: SIContainer Step 1 (Main + Runner1)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: core}
      - run: cargo test --locked --manifest-path core/Cargo.toml
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: aarch64-apple-ios}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: core, key: ios, cache-on-failure: true}
      - name: Build shared signing core
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          export ISL_GIT_SHA=${GITHUB_SHA::7}
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${HOME}/.cargo=/deps/cargo"
          cargo build --locked --release --target aarch64-apple-ios --manifest-path core/Cargo.toml
      - name: Generate SIContainer and SIContainerRunner1 targets and notices
        run: |
          python3 -m venv /tmp/ic-python
          /tmp/ic-python/bin/python -m pip install --quiet pyyaml
          /tmp/ic-python/bin/python scripts/configure_sicontainer.py
          python3 scripts/generate_notices.py
          brew install xcodegen
          xcodegen generate --spec project-sicontainer.yml
      - name: Regression tests for lifecycle, pairing, and SIContainer slots
        run: |
          swiftc -parse-as-library ios/iSideload/Core/Models.swift ios/iSideload/Core/InstalledAppState.swift tests/InstalledAppStateTests.swift -o /tmp/lifecycle-tests
          /tmp/lifecycle-tests
          swiftc -parse-as-library ios/iSideload/Core/PairingRecord.swift tests/PairingRecordTests.swift -o /tmp/pair-tests
          /tmp/pair-tests
          swiftc -parse-as-library ios/iSideload/Core/SelfSigningIdentity.swift tests/SelfSigningIdentityTests.swift -o /tmp/self-signing-tests
          /tmp/self-signing-tests
          swiftc -parse-as-library ios/iSideload/Core/PeerSigningChoice.swift tests/PeerSigningChoiceTests.swift -o /tmp/peer-signing-choice-tests
          /tmp/peer-signing-choice-tests
          swiftc -parse-as-library ios/iSideload/Core/AppUpdate.swift tests/AppUpdateTests.swift -o /tmp/app-update-tests
          /tmp/app-update-tests
          swiftc -parse-as-library ios/iSideload/Core/CoreInteractionPolicy.swift tests/CoreInteractionPolicyTests.swift -o /tmp/interaction-tests
          /tmp/interaction-tests
          swiftc -parse-as-library ios/iContainer/ContainerGuest.swift tests/ContainerGuestTests.swift -o /tmp/guest-tests
          /tmp/guest-tests
      - name: Build unsigned SIContainerRunner1 (Helper Slot 1)
        run: |
          xcodebuild -project SIContainer.xcodeproj -scheme SIContainerRunner1 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > /tmp/ic-runner1-build.log 2>&1 || { tail -120 /tmp/ic-runner1-build.log; exit 1; }
          tail -8 /tmp/ic-runner1-build.log
          R1_APP=build/Build/Products/Release-iphoneos/SIContainerRunner1.app
          /usr/libexec/PlistBuddy -c "Set :ISLGitSHA ${GITHUB_SHA::7}" "$R1_APP/Info.plist"
          mkdir -p out-runner1/Payload
          cp -R "$R1_APP" out-runner1/Payload/
          (cd out-runner1 && zip -qry ../SIContainerRunner1.ipa Payload)
      - name: Build unsigned SIContainer (Main Manager)
        run: |
          xcodebuild -project SIContainer.xcodeproj -scheme SIContainer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > /tmp/ic-main-build.log 2>&1 || { tail -120 /tmp/ic-main-build.log; exit 1; }
          tail -8 /tmp/ic-main-build.log
      - name: Build original smoke guest and verify Mach-O transformation
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p demo/Payload/ContainerDemo.app
          xcrun clang -target arm64-apple-ios17.0 -isysroot "$SDK" -fobjc-arc -framework UIKit -framework Foundation -framework CoreGraphics -Wl,-headerpad,4096 tests/ContainerDemo/main.m -o demo/Payload/ContainerDemo.app/ContainerDemo
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p={'CFBundleIdentifier':'com.hongson117.icontainer.demo','CFBundleName':'ContainerDemo','CFBundleDisplayName':'iContainer Demo','CFBundleExecutable':'ContainerDemo','CFBundleSupportedPlatforms':['iPhoneOS'],'CFBundlePackageType':'APPL','CFBundleShortVersionString':'1.0','CFBundleVersion':'1','UIDeviceFamily':[1,2],'LSRequiresIPhoneOS':True}
          Path('demo/Payload/ContainerDemo.app/Info.plist').write_bytes(plistlib.dumps(p))
          PY
          rustc --edition=2021 scripts/verify_container_demo.rs -o /tmp/verify-demo
          /tmp/verify-demo demo/Payload/ContainerDemo.app/ContainerDemo /tmp/ContainerDemo.dylib
          xcrun otool -hv /tmp/ContainerDemo.dylib
          (cd demo && zip -qry ../iContainer-Demo.ipa Payload)
      - name: Package and audit SIContainer and SIContainerRunner1 IPAs
        run: |
          APP=build/Build/Products/Release-iphoneos/SIContainer.app
          /usr/libexec/PlistBuddy -c "Set :ISLGitSHA ${GITHUB_SHA::7}" "$APP/Info.plist"
          cp SIContainerRunner1.ipa "$APP/SIContainerRunner1.ipa"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../SIContainer.ipa Payload)
          cp SIContainer.ipa iContainer.ipa
          python3 scripts/audit_release.py --self-test
          python3 scripts/audit_release.py SIContainer.ipa --expected-sha "${GITHUB_SHA::7}" --output sicontainer-audit.json
          python3 scripts/audit_release.py SIContainerRunner1.ipa --expected-sha "${GITHUB_SHA::7}" --output sicontainer-runner1-audit.json
          cp sicontainer-audit.json icontainer-audit.json
          shasum -a 256 SIContainer.ipa SIContainerRunner1.ipa iContainer.ipa iContainer-Demo.ipa > SIContainer-SHA256SUMS.txt
          cp SIContainer-SHA256SUMS.txt iContainer-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SIContainer-preview-${{ github.run_number }}
          path: |
            SIContainer.ipa
            SIContainerRunner1.ipa
            iContainer.ipa
            iContainer-Demo.ipa
            sicontainer-audit.json
            sicontainer-runner1-audit.json
            icontainer-audit.json
            SIContainer-SHA256SUMS.txt
            iContainer-SHA256SUMS.txt
            docs/ICONTAINER.md
            docs/ICONTAINER-PROVENANCE.md
