name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo test --manifest-path core/Cargo.toml

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core, key: ios }
      - name: Build Rust core
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          export ISL_GIT_SHA=${GITHUB_SHA::7}
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${HOME}/.cargo=/deps/cargo"
          cargo build --release --target aarch64-apple-ios --manifest-path core/Cargo.toml
          ls -la core/target/aarch64-apple-ios/release/libisl_core.a
      - name: Test installed app lifecycle
        run: |
          swiftc -parse-as-library ios/iSideload/Core/Models.swift ios/iSideload/Core/InstalledAppState.swift tests/InstalledAppStateTests.swift -o /tmp/installed-app-state-tests
          /tmp/installed-app-state-tests
      - name: Generate Xcode project
        run: |
          python3 scripts/generate_notices.py
          brew install xcodegen && xcodegen generate
      - name: Build tunnel extension (compile check only, not shipped)
        run: |
          xcodebuild -project iSideload.xcodeproj -target iSideloadTunnel -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -5
      - name: Build app (unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project iSideload.xcodeproj -scheme iSideload -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > /tmp/xb.log 2>&1 || true; grep -E " error:" /tmp/xb.log | sort -u | head -40; tail -20 /tmp/xb.log; grep -q "BUILD SUCCEEDED" /tmp/xb.log
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/iSideload.app
          /usr/libexec/PlistBuddy -c "Set :ISLGitSHA ${GITHUB_SHA::7}" "$APP/Info.plist"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry ../iSideload.ipa Payload)
          ls -la iSideload.ipa
      - name: Audit public IPA
        run: |
          python3 scripts/audit_release.py --self-test
          python3 scripts/audit_release.py iSideload.ipa --expected-sha "${GITHUB_SHA::7}" --output release-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: iSideload-${{ github.run_number }}
          path: |
            iSideload.ipa
            release-audit.json
