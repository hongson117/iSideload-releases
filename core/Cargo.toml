[package]
name = "isl_core"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "iSideload core: Apple ID sign-in, signing, and on-device install over a loopback VPN, exposed over a small C ABI"

[lib]
name = "isl_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { version = "0.1.61", default-features = false, features = [
  "afc", "house_arrest", "installation_proxy", "tcp", "ring", "remote_pairing", "rsd", "tunnel_tcp_stack",
] }
isideload = { version = "0.4.6", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
rootcause = "0.12.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time", "sync"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
plist = "1.8"
apple-codesign-quick = "0.1.0"
p12-keystore = { version = "0.3.0-rc4", package = "isideload-p12-keystore" }
rsa = "0.9.10"
x509-cert = "0.2.5"
zip = { version = "*", default-features = false, features = ["deflate"] }

[patch.crates-io]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "d32c8189c51c2789496b0768039419c3705498c3" }
isideload = { path = "vendor/isideload" }

[profile.release]
debug = 0
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
