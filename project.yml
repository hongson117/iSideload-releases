name: iSideload
options:
  bundleIdPrefix: com.hongson117
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  iSideload:
    type: application
    platform: iOS
    sources:
      - path: ios/iSideload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongson117.isideload
        PRODUCT_NAME: iSideload
        INFOPLIST_FILE: ios/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ios/iSideload/App/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lisl_core -lc++ -framework Security -framework SystemConfiguration -framework CoreFoundation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: NO
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_STYLE: all
        DEAD_CODE_STRIPPING: YES
        COPY_PHASE_STRIP: YES
        DEBUG_INFORMATION_FORMAT: dwarf
        GCC_SYMBOLS_PRIVATE_EXTERN: YES
  # Optional, NOT embedded in the app: free Apple IDs cannot sign Network Extensions.
  iSideloadTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Tunnel
        excludes: ["*.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongson117.isideload.tunnel
        INFOPLIST_FILE: ios/Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Tunnel/Tunnel.entitlements
        CODE_SIGNING_ALLOWED: NO
