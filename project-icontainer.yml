name: iContainer
options:
  bundleIdPrefix: com.hongson117
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    MARKETING_VERSION: 1.2.3
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
targets:
  iContainer:
    type: application
    platform: iOS
    sources:
    - path: ios/iSideload
    - path: ios/iContainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongson117.icontainer
        PRODUCT_NAME: iContainer
        INFOPLIST_FILE: ios/iContainer/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ios/iContainer/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/core/target/aarch64-apple-ios/release
        OTHER_LDFLAGS: -lisl_core -lc++ -framework Security -framework SystemConfiguration
          -framework CoreFoundation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        ENABLE_BITCODE: false
        CODE_SIGNING_ALLOWED: false
        SUPPORTS_MACCATALYST: false
        DEPLOYMENT_POSTPROCESSING: true
        STRIP_INSTALLED_PRODUCT: true
        STRIP_STYLE: all
        DEAD_CODE_STRIPPING: true
        COPY_PHASE_STRIP: true
        DEBUG_INFORMATION_FORMAT: dwarf
        GCC_SYMBOLS_PRIVATE_EXTERN: true
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OPTIMIZATION_LEVEL: -O
        ENABLE_TESTABILITY: false
        SWIFT_SERIALIZE_DEBUGGING_OPTIONS: false
        STRIP_SWIFT_SYMBOLS: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ICONTAINER
        MARKETING_VERSION: 0.1.1
        CLANG_ENABLE_OBJC_ARC: 'YES'
